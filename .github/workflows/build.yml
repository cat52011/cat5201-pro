# CI：每次 push / PR 自動建置 + 跑測試（商品級安全網——本機忘了跑，這裡會攔住）。
name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build (solution)
        run: dotnet build cat5201pro.sln -c Release -warnaserror:false

      # 有已知漏洞的套件（含間接相依）就讓這次建置失敗。
      - name: Check vulnerable packages
        shell: pwsh
        run: |
          $out = dotnet list cat5201pro.sln package --vulnerable --include-transitive | Out-String
          Write-Host $out
          if ($out -match '(?m)^\s+>\s') { throw 'Vulnerable packages found' }

      - name: Test
        run: dotnet test tests/cat5201.Tests/cat5201.Tests.csproj -c Release --no-restore
